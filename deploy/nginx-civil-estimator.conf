# /etc/nginx/sites-available/civil-estimator
#
# Streamlit talks over a websocket and keeps it open for the life of the tab.
# Two settings below are load-bearing rather than boilerplate: the Upgrade
# headers, without which the app loads and then never updates, and the long
# read timeout, without which a tab left open during a queue run is disconnected
# by nginx and looks like a crash.

server {
    listen 80;
    server_name estimator.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name estimator.example.com;

    ssl_certificate     /etc/letsencrypt/live/estimator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estimator.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A0 drawings are large. Keep this above your Streamlit upload limit.
    client_max_body_size 250M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
